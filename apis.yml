- name: Hermes Search Engine gRPC API
  description: >-
    Self-hosted, MIT-licensed Rust search engine published by Space Frontiers (github.com/SpaceFrontiers/hermes)
    with a published protobuf wire contract: hermes.SearchService (Search, GetDocument, GetIndexInfo,
    GetTextStats) and hermes.IndexService (index creation, streaming ingestion, primary-key deletion and
    upsert, commit, merge, vector-index retraining), plus hermes.broker.BrokerService for shard topology.
    Distributed as crates (hermes-core, hermes-server, hermes-broker, hermes-tool), PyPI (hermes-client-python),
    npm (hermes-client-typescript, hermes-wasm). There is no hosted endpoint: you run hermes-server yourself.
  humanURL: https://github.com/SpaceFrontiers/hermes
  x-deployment: self-hosted
  x-no-hosted-base-url: The gRPC server is run by the consumer (cargo install hermes-server); Space Frontiers publishes no hosted Hermes endpoint, so no baseURL is recorded rather than inventing one.
  tags:
  - Search
  - gRPC
  - Open-Source
  tags_raw:
  - search
  - grpc
  - open-source
  - Open Source
  properties:
  - type: Protobuf
    url: grpc/machinelibrary-ai-hermes.proto
  - type: Protobuf
    url: grpc/machinelibrary-ai-hermes-broker.proto
  - type: Documentation
    url: https://github.com/SpaceFrontiers/hermes/blob/main/hermes-proto/README.md
  - type: SourceCode
    url: https://github.com/SpaceFrontiers/hermes
