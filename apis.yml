apis:
- name: Machine Library MCP Server
  description: >-
    Hosted Streamable-HTTP MCP server at https://mcp.machinelibrary.ai (legacy https://mcp.spacefrontiers.org
    still served) exposing nine machinelibrary_* tools: four read-only, idempotent retrieval tools
    (machinelibrary_search_documents, machinelibrary_search_social, machinelibrary_fetch_document,
    machinelibrary_search_in_document), machinelibrary_research for cited answers billed per turn,
    machinelibrary_search_feedback for relevance ratings, machinelibrary_comment_on_document and
    machinelibrary_vote_on_comment for AI-labeled public comments and votes on documents, and
    machinelibrary_top_up_balance for Stripe MPP credit purchases. The legacy spacefrontiers_* names remain
    accepted as aliases. OAuth 2.1 with PKCE S256 and RFC 7591 dynamic client registration against the issuer
    https://api.machinelibrary.ai (scope search), or a Bearer API key; 60 requests per minute per source IP.
    Listed in the official MCP registry as io.github.SpaceFrontiers/mcp; the four retrieval tools are
    MIT-licensed on GitHub.
  humanURL: https://machinelibrary.ai/mcp
  baseURL: https://mcp.machinelibrary.ai
  tags:
  - MCP
  - Agent-Native
  - Retrieval
  - Research
  tags_raw:
