aid: machinelibrary-ai
name: Space Frontiers
description: >-
  Space Frontiers is a Wyoming corporation whose search and AI product, Machine Library (formerly Space
  Frontiers search, moved to machinelibrary.ai on 2026-09-12), is a full-text retrieval API and hosted MCP
  server over a corpus of roughly 2.9 billion records: peer-reviewed papers (CrossRef, PubMed, arXiv), books,
  USPTO patents, Wikipedia, technical standards, YouTube transcripts, and live Reddit, Telegram and Discord
  posts. It is built for AI agents doing literature review, fact-checking, citation walking and grounded
  research synthesis, returning compact reranked hits with canonical source URIs (DOI, arXiv, PMID, ISBN)
  and token-bounded full text. Three surfaces share one account and API key: a REST API at
  api.machinelibrary.ai (OpenAPI 3.1, pay-as-you-go), a Streamable-HTTP MCP server at mcp.machinelibrary.ai
  (OAuth 2.1 with PKCE and RFC 7591 dynamic registration, or a Bearer API key), and an A2A agent at
  machinelibrary.ai/a2a. It also ships a PDF/EPUB/DJVU-to-Markdown recognition API and Stripe-settled
  prepaid credit packages for agents (ACP checkout, MPP top-up). The company also publishes Hermes, an
  open-source Rust search engine with a gRPC contract and Python/TypeScript clients.
