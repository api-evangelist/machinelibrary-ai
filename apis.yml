- name: Machine Library A2A Agent
  description: >-
    A2A (protocolVersion 0.3.0) research and commerce agent at https://machinelibrary.ai/a2a over JSON-RPC:
    grounded research answers with citation artifacts, search-access guidance, and prepaid-credit sales
    settled through Stripe (ACP checkout sessions and MPP payment challenges), with two AP2 merchant-role
    extensions declared. The agent card is served at /.well-known/agent-card.json on machinelibrary.ai
    and spacefrontiers.org. Unauthenticated message/send is answered live with authentication guidance.
  humanURL: https://machinelibrary.ai/.well-known/agent-card.json
  baseURL: https://machinelibrary.ai/a2a
  x-baseurl-note: >-
    JSON-RPC endpoint; answers POST message/send (200) and 404s a plain GET, so the humanURL is the served
    agent card rather than the endpoint.
  tags:
  - A2A
  - Agent-Native
  - Research
  - Payments
  tags_raw:
  - a2a
  - agent-native
  - research
  - payments
  properties:
  - type: AgentCard
    url: a2a/machinelibrary-ai-a2a.yml
  - type: Documentation
    url: https://api.machinelibrary.ai/auth.md
- name: Hermes Search Engine gRPC API
  description: >-
    Self-hosted, MIT-licensed Rust search engine published by Space Frontiers (github.com/SpaceFrontiers/hermes)
    with a published protobuf wire contract: hermes.SearchService (Search, GetDocument, GetIndexInfo,
    GetTextStats) and hermes.IndexService (index creation, streaming ingestion, primary-key deletion and
    upsert, commit, merge, vector-index retraining), plus hermes.broker.BrokerService for shard topology.
    Distributed as crates (hermes-core, hermes-server, hermes-broker, hermes-tool), PyPI (hermes-client-python),
    npm (hermes-client-typescript, hermes-wasm). There is no hosted endpoint: you run hermes-server yourself.
  humanURL: https://github.com/SpaceFrontiers/hermes
  x-deployment: self-hosted
  x-no-hosted-base-url: >-
    The gRPC server is run by the consumer (cargo install hermes-server); Space Frontiers publishes no
    hosted Hermes endpoint, so no baseURL is recorded rather than inventing one.
  tags:
  - Search
  - gRPC
  - Open Source
  tags_raw:
  - search
  - grpc
  - open-source
  - Open Source
  - Open-Source
