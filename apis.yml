- name: Machine Library MCP Server
  description: >-
    Hosted Streamable-HTTP MCP server at https://mcp.machinelibrary.ai (legacy https://mcp.spacefrontiers.org
    still served) exposing four read-only, idempotent retrieval tools (spacefrontiers_search_documents,
    spacefrontiers_search_social, spacefrontiers_fetch_document, spacefrontiers_search_in_document), a
    hosted spacefrontiers_top_up_balance payment tool, a deep_research_agent prompt and a
    spacefrontiers://document/{uri_b64} resource template. OAuth 2.1 with PKCE and RFC 7591 dynamic client
    registration against https://api.spacefrontiers.org, or a Bearer API key. Listed in the official MCP
    registry as io.github.SpaceFrontiers/mcp; source is MIT-licensed on GitHub.
  humanURL: https://machinelibrary.ai/mcp
  baseURL: https://mcp.machinelibrary.ai
