apis:
- name: Machine Library API
  description: >-
    REST API over the Machine Library corpus: hybrid full-text search across the documents and social
    indexes (POST /v2/search/), similarity search, token-bounded document fetch by ID or canonical URI
    (DOI/arXiv/PMID/ISBN), in-document passage search via text_filter, original PDF/EPUB/DJVU streaming with
    byte ranges, retrieval-augmented conversation turns (JSON or SSE stream), PDF/EPUB/DJVU-to-Markdown
    recognition jobs, and a Stripe MPP prepaid-credit top-up. Authenticated with an X-Api-Key header or the
    same key / an OAuth 2.0 access token as a Bearer token; billed per request from a prepaid USD balance.
  humanURL: https://machinelibrary.ai/docs/api
  baseURL: https://api.machinelibrary.ai
