- name: Machine Library MCP Server
  description: 'Hosted Streamable HTTP MCP server at https://mcp.machinelibrary.ai with seven machinelibrary_* tools:
    document search, social search, document fetch, in-document search, cited research, result feedback, and Stripe
    MPP prepaid-credit purchases. Legacy spacefrontiers_* calls and https://mcp.spacefrontiers.org remain compatible.
    OAuth uses https://api.machinelibrary.ai with S256 PKCE, dynamic registration and the search scope; Bearer API
    keys are also accepted. The separate Python source package has its own release versions and capabilities; its
    resource templates are not the hosted service contract.'
  humanURL: https://machinelibrary.ai/mcp
  baseURL: https://mcp.machinelibrary.ai
