aid: machinelibrary-ai
name: Space Frontiers
description: Space Frontiers is the company behind Machine Library, a research search API and hosted MCP server.
  Its corpus contains roughly 2.9 billion records across scholarly literature, books, patents, Wikipedia, standards,
  video transcripts and public discussions. Records include metadata and full text where available; total record
  count is not a count of searchable or retrievable full-text documents. Machine Library offers REST search, bounded
  document retrieval, cited research conversations, document recognition, and seven hosted MCP tools, using API
  keys or OAuth with the search scope. Legacy Space Frontiers API and MCP hosts remain compatible. The company also
  publishes the separate self-hosted Hermes search engine.
