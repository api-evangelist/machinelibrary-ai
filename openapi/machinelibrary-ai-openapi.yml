openapi: 3.1.0
info:
  title: Machine Library API
  description: 'Search, retrieve, and synthesize scholarly and public-interest documents through Machine Library, the search
    and AI product by Space Frontiers Company. Document recognition endpoints (`/v1/recognitions`: PDF, EPUB, and DJVU to
    structured Markdown) share this host and are described at `/v1/recognitions/docs/openapi.json`; the site reference at
    https://machinelibrary.ai/docs/api/reference presents both specs merged.'
  license:
    name: MIT (API description only; retrieved content retains its own rights)
    identifier: MIT
  version: 0.1.0
  contact:
    email: contact@machinelibrary.ai
    name: Machine Library
    url: https://machinelibrary.ai/contacts
  termsOfService: https://machinelibrary.ai/terms-of-service
servers:
- description: Machine Library
  url: https://api.machinelibrary.ai
- description: Space Frontiers (compatible endpoint)
  url: https://api.spacefrontiers.org
paths:
  /v2/search/:
    post:
      tags:
      - Search
      summary: Search across one or more Machine Library indexes.
      operationId: searchDocuments
      requestBody:
        description: Search query, filters, retrieval mode, and result window.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequestV2'
        required: true
      responses:
        '200':
          description: Ranked search results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2SearchResponse'
        '400':
          description: Invalid query, filters, or result window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          headers:
            X-Request-Id:
              description: Include this identifier when contacting support.
              schema:
                type: string
        '401':
          description: Missing or invalid API credential.
          content:
            application/json:
              example:
                detail: Unauthorized
                status: error
              schema:
                $ref: '#/components/schemas/ApiError'
          headers:
            X-Request-Id:
              description: Include this identifier when contacting support.
              schema:
                type: string
        '402':
          description: Insufficient account balance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          headers:
            X-Request-Id:
              description: Include this identifier when contacting support.
              schema:
                type: string
        '500':
          description: Search service failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          headers:
            X-Request-Id:
              description: Include this identifier when contacting support.
              schema:
                type: string
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Query or parameters could not be processed.
          headers:
            X-Request-Id:
              description: Include this identifier when contacting support.
              schema:
                type: string
        '429':
          content:
            application/json:
              example:
                detail:
                  code: rate_limited
                  retry_after_seconds: 2
                  scope: search
                status: error
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Request budget or search capacity exhausted. Honor Retry-After and use bounded backoff.
          headers:
            Retry-After:
              description: Minimum delay in seconds before retrying this application-level rejection. Edge responses may differ.
              schema:
                minimum: 1
                type: integer
            X-Request-Id:
              description: Include this identifier when contacting support.
              schema:
                type: string
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: A required service is temporarily unavailable.
          headers:
            X-Request-Id:
              description: Include this identifier when contacting support.
              schema:
                type: string
      security:
      - api_key: []
      - bearer_auth: []
      - oauth2:
        - search
      description: Search documents and public discussions. Results are bounded by offset + limit <= 500. Each completed billed
        request can consume credits, including retries.
  /v2/search/feedback:
    post:
      tags:
      - Search
      operationId: submitSearchFeedback
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchFeedback'
        required: true
      responses:
        '200':
          description: Feedback accepted into the quality event stream.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackAccepted'
        '422':
          description: Invalid, expired or mismatched result receipt or ratings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          headers:
            X-Request-Id:
              description: Include this identifier when contacting support.
              schema:
                type: string
        '503':
          description: Feedback signing is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          headers:
            X-Request-Id:
              description: Include this identifier when contacting support.
              schema:
                type: string
        '401':
          content:
            application/json:
              example:
                detail: Unauthorized
                status: error
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Missing or invalid credential.
          headers:
            X-Request-Id:
              description: Include this identifier when contacting support.
              schema:
                type: string
        '429':
          content:
            application/json:
              example:
                detail:
                  code: rate_limited
                  retry_after_seconds: 2
                  scope: search
                status: error
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Request budget or search capacity exhausted. Honor Retry-After and use bounded backoff.
          headers:
            Retry-After:
              description: Minimum delay in seconds before retrying this application-level rejection. Edge responses may differ.
              schema:
                minimum: 1
                type: integer
            X-Request-Id:
              description: Include this identifier when contacting support.
              schema:
                type: string
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Internal service error. Retain X-Request-Id for support; do not blindly replay writes.
          headers:
            X-Request-Id:
              description: Include this identifier when contacting support.
              schema:
                type: string
      security:
      - api_key: []
      - bearer_auth: []
      - oauth2:
        - search
      description: Submit ratings bound to a valid search result receipt. Invalid or expired receipts return 422. Do not blindly
        replay feedback after an uncertain outcome.
  /v2/documents/by-uri/{uri}:
    get:
      tags:
      - Documents
      summary: Fetch a document by canonical URI, or search inside it with `text_filter`.
      operationId: getDocumentByUri
      parameters:
      - description: Percent-encoded canonical URI, such as doi://10.1000/example.
        in: path
        name: uri
        required: true
        schema:
          type: string
      - description: When present, return up to five matching passages instead of the full document. Double-quoted spans must
          occur verbatim in the passage.
        in: query
        name: text_filter
        required: false
        schema:
          type: string
      - description: Return exactly the first N content tokens. Omit to return all content tokens.
        in: query
        name: max_tokens
        required: false
        schema:
          minimum: 0
          type: integer
      responses:
        '200':
          description: Document or in-document search results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ByUriResponse'
        '400':
          description: Invalid URI or text filter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          headers:
            X-Request-Id:
              description: Include this identifier when contacting support.
              schema:
                type: string
        '401':
          description: Missing or invalid API credential.
          content:
            application/json:
              example:
                detail: Unauthorized
                status: error
              schema:
                $ref: '#/components/schemas/ApiError'
          headers:
            X-Request-Id:
              description: Include this identifier when contacting support.
              schema:
                type: string
        '402':
          description: Insufficient account balance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          headers:
            X-Request-Id:
              description: Include this identifier when contacting support.
              schema:
                type: string
        '404':
          description: Document not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          headers:
            X-Request-Id:
              description: Include this identifier when contacting support.
              schema:
                type: string
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Query or parameters could not be processed.
          headers:
            X-Request-Id:
              description: Include this identifier when contacting support.
              schema:
                type: string
        '429':
          content:
            application/json:
              example:
                detail:
                  code: rate_limited
                  retry_after_seconds: 2
                  scope: search
                status: error
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Request budget or search capacity exhausted. Honor Retry-After and use bounded backoff.
          headers:
            Retry-After:
              description: Minimum delay in seconds before retrying this application-level rejection. Edge responses may differ.
              schema:
                minimum: 1
                type: integer
            X-Request-Id:
              description: Include this identifier when contacting support.
              schema:
                type: string
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Internal service error. Retain X-Request-Id for support; do not blindly replay writes.
          headers:
            X-Request-Id:
              description: Include this identifier when contacting support.
              schema:
                type: string
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: A required service is temporarily unavailable.
          headers:
            X-Request-Id:
              description: Include this identifier when contacting support.
              schema:
                type: string
      security:
      - api_key: []
      - bearer_auth: []
      - oauth2:
        - search
      description: Retrieve document text with optional token bounds and passage filtering. A repeated successful fetch can
        incur another usage charge.
