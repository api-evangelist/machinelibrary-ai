      security:
      - api_key: []
      - bearer_auth: []
      - oauth2:
        - search
      description: Create or recompute a conversation turn using retrieved evidence. This operation can spend credits and
        has no general Idempotency-Key contract. After a timeout, inspect the conversation before submitting another turn.
        Streaming errors after headers are sent are delivered in the stream, not as a new HTTP status.
