    post:
      operationId: create_recognition
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                file:
                  description: PDF, EPUB, or DJVU, up to 100 MB. Format is detected from bytes.
                  format: binary
                  type: string
                languages:
                  description: Optional comma-separated OCR language hints, e.g. "eng,deu". When omitted, the language is
                    detected from the document body, falling back to English.
                  type: string
              required:
              - file
              type: object
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecognitionSubmission'
          description: Job accepted; poll the Location header.
        '401':
          description: Missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecognitionError'
          description: Insufficient balance.
        '413':
          description: File exceeds the upload limit.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecognitionError'
          description: Unsupported or invalid document.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecognitionError'
          description: Active-job limit reached; wait for a job to finish.
      summary: Submit a document for recognition
      tags:
      - Recognition
      security:
      - api_key: []
      - bearer_auth: []
      - oauth2:
        - search
      description: Submit a PDF, EPUB, or DJVU file. Poll the returned job until completion; identical content for the same
        account is deduplicated without a new charge. A 429 active-job response means wait for an existing job to finish.
