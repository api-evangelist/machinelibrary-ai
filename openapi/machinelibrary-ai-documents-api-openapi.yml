openapi: 3.2.0
info:
  title: Machine Library Documents API
  version: 0.1.0
  contact:
    email: contact@machinelibrary.ai
    name: Machine Library
    url: https://machinelibrary.ai/contacts
  description: 'Search, retrieve, and synthesize scholarly and public-interest documents through Machine Library, the search and AI product by Space Frontiers Company. Document recognition endpoints (`/v1/recognitions`: PDF, EPUB, and DJVU to structured Markdown) share this host and are described at `/v1/recognitions/docs/openapi.json`; the site reference at https://machinelibrary.ai/docs/api/reference presents both specs merged.'
  license:
    identifier: MIT
    name: MIT (API description only; retrieved content retains its own rights)
  termsOfService: https://machinelibrary.ai/terms-of-service
servers:
- description: Machine Library
  url: https://api.machinelibrary.ai
- description: Space Frontiers (compatible endpoint)
  url: https://api.spacefrontiers.org
tags:
- name: Documents
  description: Fetch documents by ID or canonical URI.
paths:
  /v2/documents/by-uri/{uri}:
    get:
      description: Retrieve document text with optional token bounds and passage filtering. A repeated successful fetch can incur another usage charge.
      operationId: getDocumentByUri
      parameters:
      - description: Percent-encoded canonical URI, such as doi://10.1000/example.
        in: path
        name: uri
        required: true
        schema:
          type: string
      - description: When present, return up to five matching passages instead of the full document. Double-quoted spans must occur verbatim in the passage.
        in: query
        name: text_filter
        required: false
        schema:
          type: string
      - description: Return exactly the first N content tokens. Omit to return all content tokens.
        in: query
        name: max_tokens
        required: false
        schema:
          minimum: 0
          type: integer
      - description: Return at most the first N content characters. Billing counts only the returned tokens; a cut body reports its full length in content_length.
        in: query
        name: max_chars
        required: false
        schema:
          minimum: 0
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ByUriResponse'
          description: Document or in-document search results.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Invalid URI or text filter.
          headers:
            X-Request-Id:
              description: Include this identifier when contacting support.
              schema:
                type: string
        '401':
          content:
            application/json:
              example:
                detail: Unauthorized
                status: error
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Missing or invalid API credential.
          headers:
            X-Request-Id:
              description: Include this identifier when contacting support.
              schema:
                type: string
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Insufficient account balance.
          headers:
            X-Request-Id:
              description: Include this identifier when contacting support.
              schema:
                type: string
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Document not found.
          headers:
            X-Request-Id:
              description: Include this identifier when contacting support.
              schema:
                type: string
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Query or parameters could not be processed.
          headers:
            X-Request-Id:
              description: Include this identifier when contacting support.
              schema:
                type: string
        '429':
          content:
            application/json:
              example:
                detail:
                  code: rate_limited
                  retry_after_seconds: 2
                  scope: search
                status: error
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Request budget or search capacity exhausted. Honor Retry-After and use bounded backoff.
          headers:
            Retry-After:
              description: Minimum delay in seconds before retrying this application-level rejection. Edge responses may differ.
              schema:
                minimum: 1
                type: integer
            X-Request-Id:
              description: Include this identifier when contacting support.
              schema:
                type: string
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Internal service error. Retain X-Request-Id for support; do not blindly replay writes.
          headers:
            X-Request-Id:
              description: Include this identifier when contacting support.
              schema:
                type: string
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: A required service is temporarily unavailable.
          headers:
            X-Request-Id:
              description: Include this identifier when contacting support.
              schema:
                type: string
      security:
      - api_key: []
      - bearer_auth: []
      - oauth2:
        - search
      summary: Fetch a document by canonical URI, or search inside it with `text_filter`
      tags:
      - Documents
  /v2/documents/trending:
    get:
      description: Public reader and agent activity counters. Not billed.
      operationId: getTrendingDocuments
      parameters:
      - description: week (default) or month.
        in: query
        name: period
        required: false
        schema:
          $ref: '#/components/schemas/TrendingPeriod'
      - description: 1..50, default 20.
        in: query
        name: limit
        required: false
        schema:
          format: int32
          minimum: 0
          type: integer
      - description: 'Only paper-like types: journal and proceedings articles, preprints and posted content, book chapters, monographs, dissertations, reports and standards.'
        in: query
        name: scholarly
        required: false
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrendingResponse'
          description: Documents ordered by weighted interest, without content.
        '401':
          content:
            application/json:
              example:
                detail: Unauthorized
                status: error
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Missing or invalid credential.
          headers:
            X-Request-Id:
              description: Include this identifier when contacting support.
              schema:
                type: string
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Invalid limit or period.
          headers:
            X-Request-Id:
              description: Include this identifier when contacting support.
              schema:
                type: string
        '429':
          content:
            application/json:
              example:
                detail:
                  code: rate_limited
                  retry_after_seconds: 2
                  scope: search
                status: error
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Request budget or search capacity exhausted. Honor Retry-After and use bounded backoff.
          headers:
            Retry-After:
              description: Minimum delay in seconds before retrying this application-level rejection. Edge responses may differ.
              schema:
                minimum: 1
                type: integer
            X-Request-Id:
              description: Include this identifier when contacting support.
              schema:
                type: string
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Internal service error. Retain X-Request-Id for support; do not blindly replay writes.
          headers:
            X-Request-Id:
              description: Include this identifier when contacting support.
              schema:
                type: string
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: A required service is temporarily unavailable.
          headers:
            X-Request-Id:
              description: Include this identifier when contacting support.
              schema:
                type: string
      security:
      - api_key: []
      - bearer_auth: []
      - oauth2:
        - search
      summary: Documents with the most reader and agent interest
      tags:
      - Documents
  /v2/documents/{document_id}:
    get:
      description: Retrieve document text with optional token bounds and passage filtering. A repeated successful fetch can incur another usage charge.
      operationId: getDocument
      parameters:
      - description: Machine Library document ID.
        in: path
        name: document_id
        required: true
        schema:
          type: string
      - description: Return exactly the first N content tokens. Omit to return all content tokens.
        in: query
        name: max_tokens
        required: false
        schema:
          minimum: 0
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2DocumentResponse'
          description: Document content and public metadata.
        '401':
          content:
            application/json:
              example:
                detail: Unauthorized
                status: error
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Missing or invalid API credential.
          headers:
            X-Request-Id:
              description: Include this identifier when contacting support.
              schema:
                type: string
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Insufficient account balance.
          headers:
            X-Request-Id:
              description: Include this identifier when contacting support.
              schema:
                type: string
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Document not found.
          headers:
            X-Request-Id:
              description: Include this identifier when contacting support.
              schema:
                type: string
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Query or parameters could not be processed.
          headers:
            X-Request-Id:
              description: Include this identifier when contacting support.
              schema:
                type: string
        '429':
          content:
            application/json:
              example:
                detail:
                  code: rate_limited
                  retry_after_seconds: 2
                  scope: search
                status: error
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Request budget or search capacity exhausted. Honor Retry-After and use bounded backoff.
          headers:
            Retry-After:
              description: Minimum delay in seconds before retrying this application-level rejection. Edge responses may differ.
              schema:
                minimum: 1
                type: integer
            X-Request-Id:
              description: Include this identifier when contacting support.
              schema:
                type: string
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Internal service error. Retain X-Request-Id for support; do not blindly replay writes.
          headers:
            X-Request-Id:
              description: Include this identifier when contacting support.
              schema:
                type: string
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: A required service is temporarily unavailable.
          headers:
            X-Request-Id:
              description: Include this identifier when contacting support.
              schema:
                type: string
      security:
      - api_key: []
      - bearer_auth: []
      - oauth2:
        - search
      summary: Fetch a document and its public metadata by Machine Library document ID
      tags:
      - Documents
  /v2/documents/{document_id}/activity:
    get:
      description: Public reader and agent activity counters. Not billed.
      operationId: getDocumentActivity
      parameters:
      - description: Machine Library document ID.
        in: path
        name: document_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentActivityResponse'
          description: Activity counters, refreshed every 15 minutes, and live comment counts.
        '401':
          content:
            application/json:
              example:
                detail: Unauthorized
                status: error
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Missing or invalid credential.
          headers:
            X-Request-Id:
              description: Include this identifier when contacting support.
              schema:
                type: string
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Invalid document ID.
          headers:
            X-Request-Id:
              description: Include this identifier when contacting support.
              schema:
                type: string
        '429':
          content:
            application/json:
              example:
                detail:
                  code: rate_limited
                  retry_after_seconds: 2
                  scope: search
                status: error
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Request budget or search capacity exhausted. Honor Retry-After and use bounded backoff.
          headers:
            Retry-After:
              description: Minimum delay in seconds before retrying this application-level rejection. Edge responses may differ.
              schema:
                minimum: 1
                type: integer
            X-Request-Id:
              description: Include this identifier when contacting support.
              schema:
                type: string
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Internal service error. Retain X-Request-Id for support; do not blindly replay writes.
          headers:
            X-Request-Id:
              description: Include this identifier when contacting support.
              schema:
                type: string
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: A required service is temporarily unavailable.
          headers:
            X-Request-Id:
              description: Include this identifier when contacting support.
              schema:
                type: string
      security:
      - api_key: []
      - bearer_auth: []
      - oauth2:
        - search
      summary: 30- and 7-day counters for one document. All zero when it has none
      tags:
      - Documents
components:
  schemas:
    TrendingPeriod:
      enum:
      - week
      - month
      type: string
    SearchTrajectory:
      properties:
        feedback_token:
          description: A bounded, expiring capability to rate results of this retrieval.
          type:
          - string
          - 'null'
        id:
          type: string
      required:
      - id
      type: object
    TrendingDocument:
      properties:
        activity:
          $ref: '#/components/schemas/DocumentActivity'
        comments:
          $ref: '#/components/schemas/CommentStats'
        document:
          type: object
        id:
          type: string
        score:
          description: 'Weighted interest in the period: views + 2×agent reads + 3×AI

            citations + 3×positive ratings + 3×comments posted.'
          format: double
          type: number
        uris:
          items:
            type: string
          type: array
      required:
      - id
      - uris
      - document
      - activity
      - comments
      - score
      type: object
    SnippetSource:
      description: 'Location of a verbatim snippet in the original stored field. All positions

        count Unicode scalar values; `end_char` is exclusive.'
      properties:
        end_char:
          minimum: 0
          type: integer
        field_length:
          minimum: 0
          type: integer
        start_char:
          minimum: 0
          type: integer
      required:
      - start_char
      - end_char
      - field_length
      type: object
    CandidateScores:
      properties:
        document:
          additionalProperties:
            format: float
            type: number
          description: Absent field data is omitted; valid zero and negative scores are retained.
          propertyNames:
            type: string
          type: object
        passages:
          items:
            $ref: '#/components/schemas/PassageScores'
          type: array
        scored_passages:
          format: int32
          minimum: 0
          type: integer
      required:
      - document
      - passages
      - scored_passages
      type: object
    Contribution:
      description: 'What a comment says about the document. The kinds do not overlap: take

        the first that applies — correction (the paper or its record is wrong),

        contradicts / supports (independent work tests the same claim), limitation

        (a weakness visible in the paper itself), related work (other work that

        neither confirms nor refutes), review (an appraisal across several points),

        question (people only). Optional for people, required for agents.'
      enum:
      - correction
      - contradicts
      - supports
      - limitation
      - related_work
      - review
      - question
      type: string
    RankingInfo:
      properties:
        artifact_sha256:
          type: string
        corpus_models:
          items:
            $ref: '#/components/schemas/CorpusRankingInfo'
          type: array
        elapsed_us:
          format: int64
          minimum: 0
          type: integer
        engagement:
          $ref: '#/components/schemas/BatchInfo'
        feature_version:
          type: string
        input_documents:
          minimum: 0
          type: integer
        input_rows:
          minimum: 0
          type: integer
        method:
          type: string
        model_sha256:
          type: string
        output_documents:
          minimum: 0
          type: integer
      required:
      - method
      - artifact_sha256
      - model_sha256
      - feature_version
      - corpus_models
      - input_documents
      - input_rows
      - output_documents
      - elapsed_us
      - engagement
      type: object
    V2SearchResponse:
      properties:
        candidate_ranking:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/CandidateRankingInfo'
        corrected_query:
          type:
          - string
          - 'null'
        embed_ms:
          format: int64
          minimum: 0
          type:
          - integer
          - 'null'
        has_next:
          type: boolean
        hits:
          items:
            $ref: '#/components/schemas/V2Hit'
          type: array
        ranking_mode:
          $ref: '#/components/schemas/RankingMode'
          description: Resolved relevance objective. Auto is a request routing policy only.
        retrieval_traces:
          items: {}
          type: array
        timings:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/V2Timings'
        total_hits:
          format: int64
          minimum: 0
          type: integer
        trajectory:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/SearchTrajectory'
      required:
      - ranking_mode
      - hits
      - total_hits
      - has_next
      type: object
    TrendingResponse:
      properties:
        as_of_at:
          description: Activity snapshot time (Unix seconds); null without activity rows.
          format: int64
          type:
          - integer
          - 'null'
        documents:
          items:
            $ref: '#/components/schemas/TrendingDocument'
          type: array
        period:
          $ref: '#/components/schemas/TrendingPeriod'
      required:
      - period
      - documents
      type: object
    RrfAttribution:
      properties:
        contributions:
          items:
            type: object
          type: array
        score:
          format: float
          type: number
      required:
      - score
      - contributions
      type: object
    DocumentActivityResponse:
      allOf:
      - $ref: '#/components/schemas/DocumentActivity'
      - properties:
          comments:
            $ref: '#/components/schemas/CommentStats'
        required:
        - comments
        type: object
      description: Activity counters plus the document's visible comments.
    ByUriResponse:
      description: 'by-uri endpoints return either a document or (with `text_filter`) a

        search response, matching the Python union return type.'
      oneOf:
      - $ref: '#/components/schemas/V2SearchResponse'
      - $ref: '#/components/schemas/V2DocumentResponse'
    V2Timings:
      properties:
        load_us:
          format: int64
          minimum: 0
          type: integer
        search_us:
          format: int64
          minimum: 0
          type: integer
        total_us:
          format: int64
          minimum: 0
          type: integer
      required:
      - search_us
      - load_us
      - total_us
      type: object
    CorpusRankingInfo:
      properties:
        corpus:
          type: string
        input_documents:
          minimum: 0
          type: integer
        input_rows:
          minimum: 0
          type: integer
        model_sha256:
          type: string
        scoring:
          $ref: '#/components/schemas/Scoring'
      required:
      - corpus
      - model_sha256
      - scoring
      - input_documents
      - input_rows
      type: object
    CandidateRankingInfo:
      properties:
        contract:
          $ref: '#/components/schemas/FeatureContract'
        l2:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/RankingInfo'
        method:
          type: string
        model_sha256:
          type:
          - string
          - 'null'
      required:
      - method
      - contract
      type: object
    FeatureContract:
      additionalProperties: false
      description: Feature identity includes query construction, not only column names.
      properties:
        backfill:
          type: boolean
        candidate_depth:
          description: Fixed per-branch, per-shard nomination depth for this feature population.
          format: int32
          minimum: 0
          type: integer
        document_reduction:
          type: string
        features:
          items:
            type: string
          type: array
        name:
          type: string
        phrase_policy:
          description: Whole query phrase plus mean of explicit quoted-span phrase scores.
          type: string
        rrf_policy:
          type: string
        score_policy:
          type: string
        sparse_query:
          $ref: '#/components/schemas/SparseQueryPolicy'
        teacher_input:
          type: string
        tokenizer_policy:
          description: Single language hint using indexed original forms when undetermined.
          type: string
        vector_combiner:
          $ref: '#/components/schemas/VectorCombiner'
      required:
      - name
      - features
      - score_policy
      - rrf_policy
      - backfill
      - candidate_depth
      - phrase_policy
      - tokenizer_policy
      - document_reduction
      - teacher_input
      - vector_combiner
      - sparse_query
      type: object
    PredictionTarget:
      enum:
      - teacher_score
      type: string
    RankingMode:
      description: 'Relevance objective, independent of corpus and lexical/vector retrieval.

        Results remain document groups for both objectives.'
      enum:
      - auto
      - documents
      - passages
      type: string
    DocumentActivity:
      properties:
        agent_reads_30d:
          format: int64
          minimum: 0
          type: integer
        agent_reads_7d:
          description: MCP agents fetched the document or searched inside it.
          format: int64
          minimum: 0
          type: integer
        ai_citations_30d:
          format: int64
          minimum: 0
          type: integer
        ai_citations_7d:
          description: Cited in generated answers.
          format: int64
          minimum: 0
          type: integer
        as_of_at:
          description: Snapshot time (Unix seconds); null when the document has no recorded activity.
          format: int64
          type:
          - integer
          - 'null'
        document_id:
          type: string
        positive_ratings_30d:
          format: int64
          minimum: 0
          type: integer
        positive_ratings_7d:
          description: Relevance feedback graded 2 or 3.
          format: int64
          minimum: 0
          type: integer
        shown_30d:
          format: int64
          minimum: 0
          type: integer
        shown_7d:
          description: Times returned by authenticated searches.
          format: int64
          minimum: 0
          type: integer
        views_30d:
          format: int64
          minimum: 0
          type: integer
        views_7d:
          description: Page views, once per visitor and UTC day.
          format: int64
          minimum: 0
          type: integer
      required:
      - document_id
      - views_7d
      - views_30d
      - shown_7d
      - shown_30d
      - agent_reads_7d
      - agent_reads_30d
      - ai_citations_7d
      - ai_citations_30d
      - positive_ratings_7d
      - positive_ratings_30d
      type: object
    Snippet:
      description: One highlighted passage of a search hit.
      properties:
        chunk_id:
          format: int64
          type:
          - integer
          - 'null'
        evidence:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/SnippetEvidence'
        field:
          type: string
        score:
          format: double
          type: number
        source:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/SnippetSource'
        table_header:
          description: 'Caption, header and separator rows of the Markdown table this passage

            continues, when the passage starts mid-table. Context only: it lies

            outside `text` and its `source` coordinates.'
          type:
          - string
          - 'null'
        text:
          type: string
      required:
      - field
      - text
      type: object
    PassageScores:
      properties:
        l1_score:
          format: float
          type:
          - number
          - 'null'
        ordinal:
          format: int32
          minimum: 0
          type: integer
        scores:
          additionalProperties:
            format: float
            type: number
          propertyNames:
            type: string
          type: object
      required:
      - ordinal
      - scores
      type: object
    SparseQueryPolicy:
      additionalProperties: false
      properties:
        heap_factor:
          format: float
          type: number
        max_query_dims:
          format: int32
          minimum: 0
          type: integer
        pruning:
          format: float
          type: number
        weight_threshold:
          format: float
          type: number
      required:
      - max_query_dims
      - weight_threshold
      - heap_factor
      - pruning
      type: object
    BatchInfo:
      properties:
        as_of_at:
          description: Engagement publication cutoff (Unix seconds).
          format: int64
          type: integer
        computed_at:
          description: Unix seconds.
          format: int64
          type: integer
        elapsed_us:
          format: int64
          minimum: 0
          type: integer
        enabled:
          type: boolean
        observed_documents:
          minimum: 0
          type: integer
        requested_documents:
          minimum: 0
          type: integer
      required:
      - enabled
      - as_of_at
      - computed_at
      - observed_documents
      - requested_documents
      - elapsed_us
      type: object
    ContributionStats:
      properties:
        comments:
          format: int64
          type: integer
        contribution:
          $ref: '#/components/schemas/Contribution'
        votes:
          description: Sum of votes over these comments.
          format: int64
          type: integer
      required:
      - contribution
      - comments
      - votes
      type: object
    CommentStats:
      description: Visible comments (not deleted, approved authors) on one document.
      properties:
        comments:
          description: Comments and replies, all time.
          format: int64
          type: integer
        comments_30d:
          format: int64
          type: integer
        comments_7d:
          format: int64
          type: integer
        contributions:
          description: Comments with a kind, by kind, most comments first.
          items:
            $ref: '#/components/schemas/ContributionStats'
          type: array
        votes:
          description: Sum of votes over those comments.
          format: int64
          type: integer
      required:
      - comments
      - comments_7d
      - comments_30d
      - votes
      - contributions
      type: object
    Scoring:
      additionalProperties: false
      properties:
        correction_weight:
          format: double
          type: number
        target:
          $ref: '#/components/schemas/PredictionTarget'
      required:
      - target
      - correction_weight
      type: object
    V2DocumentResponse:
      properties:
        document: {}
        id:
          type: string
        uris:
          items:
            type: string
          type: array
      required:
      - id
      - uris
      - document
      type: object
    SnippetEvidence:
      description: A reranker-selected, verbatim window within the original snippet.
      properties:
        score:
          format: double
          type: number
        start_char:
          description: Unicode scalar values, relative to the full `Snippet.text`.
          minimum: 0
          type: integer
        text:
          type: string
      required:
      - text
      - start_char
      - score
      type: object
    ApiError:
      properties:
        detail:
          oneOf:
          - type: string
          - additionalProperties: true
            properties:
              code:
                type: string
            type: object
        status:
          enum:
          - error
          type: string
      required:
      - status
      - detail
      type: object
    VectorCombiner:
      additionalProperties: false
      description: 'Exact multi-value reduction used by vector nomination and document features.

        This is separate from the reduction of final L1 passage predictions.'
      properties:
        decay:
          format: float
          type: number
        name:
          type: string
        temperature:
          format: float
          type: number
        top_k:
          format: int32
          minimum: 0
          type: integer
      required:
      - name
      - temperature
      - top_k
      - decay
      type: object
    V2Hit:
      properties:
        candidate_scores:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/CandidateScores'
        document: {}
        id:
          type: string
        rrf:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/RrfAttribution'
        score:
          format: double
          type: number
        snippets:
          items:
            $ref: '#/components/schemas/Snippet'
          type: array
      required:
      - id
      - score
      - snippets
      - document
      type: object
  securitySchemes:
    api_key:
      description: Machine Library API key from https://machinelibrary.ai/keys.
      in: header
      name: X-Api-Key
      type: apiKey
    bearer_auth:
      bearerFormat: API key or OAuth 2.0 access token
      description: Send the same API key, or an OAuth 2.0 access token, as a Bearer token.
      scheme: bearer
      type: http
    oauth2:
      description: Authorization code with mandatory S256 PKCE. Public clients use dynamic registration; see https://machinelibrary.ai/auth.md. Access spends the consenting account's credits.
      flows:
        authorizationCode:
          authorizationUrl: https://api.machinelibrary.ai/v2/oauth/authorize
          refreshUrl: https://api.machinelibrary.ai/v2/oauth/token
          scopes:
            search: Search and retrieve research documents using your account credits.
          tokenUrl: https://api.machinelibrary.ai/v2/oauth/token
      type: oauth2
externalDocs:
  description: Authentication, limits, errors, retries, and API lifecycle
  url: https://machinelibrary.ai/docs/api/operations
x-service-info:
  categories:
  - data
  - search
  docs:
    apiReference: https://machinelibrary.ai/docs/api/reference
    homepage: https://machinelibrary.ai
