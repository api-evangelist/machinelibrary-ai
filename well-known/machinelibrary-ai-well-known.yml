generated: '2026-09-19'
method: probed
source: live probes of /.well-known/ on every Machine Library / Space Frontiers host on 2026-09-19
summary: >-
  A rich, real well-known surface. The apex machinelibrary.ai (and the former apex spacefrontiers.org, which
  answers the same paths directly) serves an A2A agent card, RFC 8414 authorization-server metadata, RFC 9728
  protected-resource metadata, an RFC 9727 api-catalog linkset (application/linkset+json) pointing at the
  OpenAPI and the MCP server card, and an MCP server card at /.well-known/mcp/server-card.json. The MCP hosts
  (mcp.machinelibrary.ai and legacy mcp.spacefrontiers.org) each serve their own RFC 9728 protected-resource
  document naming https://api.spacefrontiers.org as the authorization server, and that issuer host serves the
  authorization-server metadata (with RFC 7591 registration_endpoint, PKCE S256, and a WorkOS agent_auth block).
  Nothing serves security.txt, openid-configuration or ai-plugin.json.
pointer_basis: >-
  WellKnown pointer emitted on the strength of nine distinct real documents (200 + parseable JSON, correct media
  types). SecurityTxt pointer NOT emitted — RFC 9116 is unimplemented on every host (apex 404s with the Nuxt
  HTML 404 page; API/MCP hosts 404 with an empty body).
false_positive_watch: >-
  machinelibrary.ai answers unknown /.well-known/* paths with HTTP 404 and a ~250 KB HTML 404 page (a real 404,
  not a soft 200). Several non-well-known paths (/security, /changelog, /blog, /status, /payments) return a
  5.5 KB Cloudflare 403 HTML page to this crawler; those are edge blocks or absent routes, not documents, and
  are not recorded as hits.
