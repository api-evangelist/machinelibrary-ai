method: searched
source: >-
  Live probes of the well-known surface (RFC 8414 / 9728 / 9727 / 8615 documents saved under well-known/),
  the A2A card, the MCP endpoint's 401 challenge, auth.md, plus the OpenAPI at openapi/machinelibrary-ai-openapi.yml.
  Each entry names the evidence it rests on; nothing below is asserted from a marketing page.
summary: >-
  Strong OAuth/agent-discovery conformance (RFC 8414, RFC 9728 with a live WWW-Authenticate resource_metadata
  challenge, RFC 7591 dynamic client registration, PKCE S256, RFC 9727 api-catalog, MCP server card, A2A 0.3.0
  card graded conformant). The REST error envelope is a custom {detail, status} object, NOT RFC 9457, and there
  is no OpenID Connect discovery. No published SOC 2 / ISO 27001 style certification anywhere on the site, so
  NO Compliance pointer is emitted.
conformance:
- id: openapi-3.1
  conforms: true
  evidence: openapi/machinelibrary-ai-openapi.yml declares openapi 3.1.0 (fetched from https://machinelibrary.ai/openapi.json, 17 paths / 19 operations); the Recognition spec is 3.0.3.
- id: oauth2
  conforms: true
  evidence: https://api.spacefrontiers.org/.well-known/oauth-authorization-server — authorization_code + refresh_token grants, authorization_endpoint /v2/oauth/authorize, token_endpoint /v2/oauth/token (well-known/machinelibrary-ai-api-spacefrontiers-oauth-authorization-server.json).
- id: oauth2-pkce (RFC 7636)
  conforms: true
  evidence: code_challenge_methods_supported [S256] in the authorization-server metadata; auth.md section 7 requires PKCE S256 for public clients.
- id: oauth-authorization-server-metadata (RFC 8414)
  conforms: true
  evidence: 200 application/json at /.well-known/oauth-authorization-server on api.spacefrontiers.org (issuer), api.machinelibrary.ai, machinelibrary.ai and spacefrontiers.org.
- id: oauth-protected-resource-metadata (RFC 9728)
  conforms: true
  evidence: 200 at https://mcp.machinelibrary.ai/.well-known/oauth-protected-resource naming authorization_servers [https://api.spacefrontiers.org]; POST tools/list on the MCP endpoint answers 401 with WWW-Authenticate Bearer resource_metadata="https://mcp.machinelibrary.ai/.well-known/oauth-protected-resource" — the RFC 9728 section 5 challenge, observed live.
- id: oauth-dynamic-client-registration (RFC 7591)
  conforms: true
  evidence: registration_endpoint https://api.spacefrontiers.org/v2/oauth/register in the metadata; auth.md section 7 shows the RFC 7591 request body; README "Spec compliance" states RFC 7591 DCR.
- id: oauth-token-revocation (RFC 7009)
  conforms: true
  evidence: revocation_endpoint https://api.spacefrontiers.org/v2/oauth/revoke; auth.md section 6 shows token=...&token_type_hint=access_token.
- id: oauth-jwt-bearer (RFC 7523)
  conforms: true
  evidence: grant_types_supported includes urn:ietf:params:oauth:grant-type:jwt-bearer; auth.md section 5 exchanges a service-signed identity_assertion for a new access token.
- id: workos-agent-auth-claim-grant
  conforms: true
  evidence: grant_types_supported includes urn:workos:agent-auth:grant-type:claim and the metadata carries an agent_auth object (identity_endpoint, claim_endpoint, claim_complete_uri, identity_types_supported [service_auth]); auth.md sections 3-4 document the user-claimed flow with a six-digit user_code and verification_uri (device-flow-shaped).
- id: oidc
  conforms: false
  evidence: /.well-known/openid-configuration 404 on every host; no id_token, no openid scope.
- id: well-known-uris (RFC 8615)
  conforms: true
  evidence: nine real documents under /.well-known/ across the hosts (well-known/machinelibrary-ai-well-known.yml).
- id: api-catalog (RFC 9727)
  conforms: true
  evidence: https://machinelibrary.ai/.well-known/api-catalog returns application/linkset+json with service-desc and service-doc relations for the REST host and the MCP host.
- id: security-txt (RFC 9116)
  conforms: false
