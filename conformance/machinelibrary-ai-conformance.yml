- id: content-signals (robots.txt Content-Signal)
  conforms: true
  evidence: robots.txt and the Content-Signal response header carry ai-train=no, search=yes, ai-input=yes with the EU DSM Article 4 reservation text.
- id: sse-streaming
  conforms: true
