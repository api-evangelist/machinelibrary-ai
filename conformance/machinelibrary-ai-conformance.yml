- id: mcp-tool-annotations
  conforms: true
  evidence: tools.py applies readOnlyHint, idempotentHint, openWorldHint and destructiveHint:false to all four retrieval tools; AGENTS.md says this is required for the Anthropic Connectors Directory.
- id: a2a-0.3.0
  conforms: true
  evidence: /.well-known/agent-card.json on machinelibrary.ai and spacefrontiers.org, protocolVersion 0.3.0, capabilities object, skills array, preferredTransport JSONRPC; graded conformant in a2a/machinelibrary-ai-a2a.yml; the /a2a endpoint answers JSON-RPC message/send.
- id: ap2-agent-payments-extension
  conforms: true
  evidence: The agent card declares capabilities.extensions with uri https://github.com/google-agentic-commerce/AP2/tree/v0.1.0 and .../ap2/v1, params.roles [merchant]; settlement is described as Stripe ACP checkout sessions and MPP top-ups. Declared by the provider; not exercised by this pipeline.
- id: stripe-mpp
  conforms: true
  evidence: POST /v2/payments/mpp/top-up (x-payment-info method stripe) whose first call returns a 402 MPP payment challenge; install.md names the hosted MCP tool spacefrontiers_top_up_balance as returning "a standard MPP payment challenge".
- id: rfc9457
  conforms: false
  evidence: 'Error bodies are {"detail": "...", "status": "error"} (RecognitionError schema; observed live on a 401 from api.machinelibrary.ai), served as application/json, not application/problem+json.'
- id: pagination
  conforms: true
  evidence: SearchRequestV2 offset (0-499) + limit (1-500) with offset+limit <= 500; responses carry total_hits and has_next. Offset pagination, not cursor.
- id: idempotency
  conforms: partial
  evidence: Recognition API info.description — "Resubmitting identical content is idempotent and free"; MCP tools carry idempotentHint. No Idempotency-Key header on the REST writes (conversations, feedback, top-up); createMppBalanceTopUp guards double-submission with 409 only.
- id: rate-limit-headers
  conforms: true
  evidence: x-ratelimit-limit / x-ratelimit-remaining / x-ratelimit-reset observed live on api.machinelibrary.ai, mcp.machinelibrary.ai and machinelibrary.ai/a2a (legacy X-RateLimit-* family, not the IETF RateLimit header).
- id: llms-txt
  conforms: true
