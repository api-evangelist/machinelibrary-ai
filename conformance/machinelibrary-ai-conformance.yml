- id: mcp-streamable-http
  conforms: true
  evidence: server card remotes[0].type streamable-http; README states Streamable HTTP, stateless, protocol versions 2025-03-26 / 2025-06-18 / 2025-11-25; endpoint enforces MCP-Protocol-Version allowlist (auth.py).
- id: mcp-server-card
  conforms: true
  evidence: https://machinelibrary.ai/.well-known/mcp/server-card.json, application/mcp-server-card+json, $schema static.modelcontextprotocol.io/schemas/v1/server-card.schema.json.
