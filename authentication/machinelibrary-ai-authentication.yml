safety_rules_from_provider:
- Never ask a user to share a password, session cookie, API key, authorization code, access token, refresh token,
  claim token, or identity assertion in chat. (auth.md)
- Store claim_token as a secret; show the user only the verification_uri and user_code together; do not email the
  code. (auth.md)
- Send the access token only to the configured MCP resource. (auth.md)
- Follow the current auth.md for token refresh, revocation and authorization recovery. Never expose credentials
  in chat.
