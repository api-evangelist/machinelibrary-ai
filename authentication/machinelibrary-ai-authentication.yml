  sign_in_methods: Google, GitHub, or email (press page); the /keys page 302s to /auth/signin for anonymous visitors.
schemes:
- name: api_key
  type: apiKey
  in: header
  parameter: X-Api-Key
  description: Machine Library API key from https://machinelibrary.ai/keys.
  expiry: Long-lived; does not expire automatically, revocable from account settings (privacy policy section 4).
  sources:
  - openapi/machinelibrary-ai-openapi.yml
  - openapi/machinelibrary-ai-recognition-openapi.yml
  key_format: id:ml_<secret> for new keys; existing credentials remain supported.
- name: bearer_auth
  type: http
  scheme: bearer
  bearerFormat: API key or OAuth 2.0 access token
  description: Send the same API key, or an OAuth 2.0 access token, as a Bearer token.
  sources:
  - openapi/machinelibrary-ai-openapi.yml
  - openapi/machinelibrary-ai-recognition-openapi.yml
- name: oauth2
  type: oauth2
  issuer: https://api.machinelibrary.ai
  metadata: https://api.machinelibrary.ai/.well-known/oauth-authorization-server
  protected_resource_metadata:
  - https://mcp.machinelibrary.ai/.well-known/oauth-protected-resource
  - https://machinelibrary.ai/.well-known/oauth-protected-resource
  flows:
    authorizationCode:
      authorizationUrl: https://api.machinelibrary.ai/v2/oauth/authorize
      tokenUrl: https://api.machinelibrary.ai/v2/oauth/token
      refreshUrl: https://api.machinelibrary.ai/v2/oauth/token
      revocationUrl: https://api.machinelibrary.ai/v2/oauth/revoke
      registrationUrl: https://api.machinelibrary.ai/v2/oauth/register
      scopes:
        search: Search and retrieve research documents using your account credits.
      pkce: S256 required
      client_auth: none (public clients; token_endpoint_auth_methods_supported [none])
      resource_indicator: Set the OAuth resource to https://mcp.machinelibrary.ai (auth.md section 7)
    service_auth (agent claim flow):
      description: For agents that cannot receive a browser callback. POST https://api.machinelibrary.ai/v2/agent/identity
        {"type":"service_auth","login_hint":"<user email>"} returns a registration_id, a secret claim_token and
        a claim {user_code (6 digits), verification_uri, expires_in 900, interval 5}. The user opens the verification
        URI, signs in with the matching verified email, confirms the code and approves; the agent polls the token
        endpoint with grant_type=urn:workos:agent-auth:grant-type:claim&claim_token=... honouring authorization_pending
        / slow_down / access_denied / expired_token. Approval yields a one-hour access_token plus a service-signed
        identity_assertion; renew with grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer&assertion=...
      endpoints:
        identity: https://api.machinelibrary.ai/v2/agent/identity
        claim: https://api.machinelibrary.ai/v2/agent/identity/claim
        claim_complete: https://api.machinelibrary.ai/v2/agent/identity/claim/complete (browser-only; agents must
          not call it)
      constraints: Anonymous registration and external identity assertions are not accepted; the email is a login
        hint, not proof of identity.
  token_lifetimes:
    access_token: 3600 seconds
    refresh_token: 30 days, rotating; reuse of a rotated token revokes the chain
    authorization_code: deleted on exchange or after 60 seconds
  audience_binding: Tokens are audience-bound to the requested MCP host (privacy policy section 4).
  a2a_card_schemes:
    bearer: http bearer — "Machine Library API key or OAuth 2.1 access token"
    apiKey: header X-Api-Key
operation_security:
  default: All operations in the combined OpenAPI explicitly accept api_key OR bearer_auth OR oauth2 with search.
    Public metadata and pricing are separately reachable without a credential.
