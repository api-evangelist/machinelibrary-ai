deployment:
  mode: both
  endpoint: https://mcp.machinelibrary.ai
  legacy_endpoint: https://mcp.spacefrontiers.org
  install: git clone https://github.com/SpaceFrontiers/mcp.git && cd mcp && uv sync && SEARCH_API_ENDPOINT=https://api.machinelibrary.ai
    SPACE_FRONTIERS_API_KEY=<key> uv run fastmcp run mcp_server.py
  package: https://github.com/SpaceFrontiers/mcp
  package_note: pyproject name spacefrontiers-mcp 0.3.1, but it is NOT published to PyPI (pypi.org/pypi/spacefrontiers-mcp
    404 on 2026-09-19); the stdio path is a source checkout run with uv, exactly as the README's "Self-hosted (stdio)" section
    states.
  auth: oauth
  auth_detail: OAuth 2.1 authorization code + PKCE S256 with RFC 7591 dynamic client registration at https://api.machinelibrary.ai/v2/oauth/register
    (issuer https://api.machinelibrary.ai, scope search; the legacy spacefrontiers hosts name the same issuer), OR a Bearer
    API key from https://machinelibrary.ai/keys; the WorkOS-style service_auth claim flow is offered for clients that cannot
    receive a browser callback (auth.md).
  verified: probed
  verification: 'Re-probed 2026-10-03: POST https://mcp.machinelibrary.ai initialize and tools/list (Accept: application/json,
    text/event-stream) both return HTTP 401 "Authentication required" with WWW-Authenticate: Bearer resource_metadata="https://mcp.machinelibrary.ai/.well-known/oauth-protected-resource"
    and x-ratelimit-limit: 60. tools/list is auth-gated, so the inventory below is the provider''s live MCP page and llms.txt
    (nine machinelibrary_* tools); the four open-source tools carry the tools/list output (descriptions, annotations, input
    schemas) of the provider''s MIT server run in-process; the five hosted-only tools have no published input schema.'
server:
