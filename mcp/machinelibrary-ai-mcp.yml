  idempotent: true
  annotations:
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: true
  description: Search Reddit, Telegram, and Discord. Use for news, current events, and community discussion.
  server_description: "Search Reddit, Telegram channels, and Discord in the Machine Library `social` index.\n\nUse when: the\
    \ user asks about news, recent events, announcements, ongoing discussions,\ncommunity opinions, or anything time-sensitive\
    \ that wouldn't be in peer-reviewed literature.\n\nDo not use when: the question is about settled scientific knowledge,\
