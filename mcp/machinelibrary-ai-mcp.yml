  registry_name: io.github.SpaceFrontiers/mcp
  title: Machine Library
  server_info_name: Machine Library MCP Server
  version: 0.3.1
  transport: streamable-http
  url: https://mcp.machinelibrary.ai
  stateless: true
  supported_protocol_versions:
  - '2025-03-26'
  - '2025-06-18'
  - '2025-11-25'
  capabilities:
    tools: true
    prompts: true
    resources: false
  capabilities_note: server-card says resources false, but the source registers one resource template (spacefrontiers://document/{uri_b64});
    recorded as declared by the provider, discrepancy noted.
  listings:
  - Official MCP Registry (registry.modelcontextprotocol.io) as io.github.SpaceFrontiers/mcp — 0.2.1 (2026-05-07), 0.3.0 (2026-07-29),
    0.3.1 (2026-09-12); repo server.json already says 0.3.2
  - Smithery (smithery.ai/servers/@SpaceFrontiers/mcp)
  - Glama (glama.ai/mcp/servers/SpaceFrontiers/mcp)
  - one-click install links for Cursor, VS Code, VS Code Insiders on https://machinelibrary.ai/mcp
  license: MIT
  version_note: server-card.json (live 2026-10-03) reports serverInfo version 0.1.0; the registry listing versions are 0.2.1
