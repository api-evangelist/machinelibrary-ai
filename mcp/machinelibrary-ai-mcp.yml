    MCP server.\n\nExamples: \"openai gpt-5 release date\", \"site:reddit.com/r/LocalLLaMA quantization\",\n\"@telegram_channel\
    \ breaking news\", \"kubernetes 1.33 changes discussion\".\n\nTips:\n- Pair an empty `query` with `filter_uri_prefixes`\
    \ to browse a subreddit or Telegram channel\n  chronologically (combine with `filter_issued_after` for a time window).\n\
    - For broad topics, also call `machinelibrary_search_documents` in parallel for grounded sources."
  inputSchema:
    additionalProperties: false
    properties:
      query:
        default: ''
        description: Free-text search query. Can be empty when filters alone are enough (e.g. browse recent papers from one
          journal).
        maxLength: 16384
        type: string
      limit:
        default: 10
        description: Number of results to return. Keep 10 for normal agent use; use 5 when issuing several parallel queries.
        maximum: 30
        minimum: 1
        type: integer
      offset:
        default: 0
        description: Pagination offset. Use `next_offset` from a prior result.
        exclusiveMaximum: 500
        minimum: 0
        type: integer
      filter_uri_prefixes:
        default: null
        description: 'Restrict to one or more sources by URI prefix. Examples: `["https://reddit.com/r/MachineLearning/"]`
