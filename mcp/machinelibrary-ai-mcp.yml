tool_count: 9
tools:
- name: machinelibrary_search_documents
  category: search
  legacy_alias: spacefrontiers_search_documents
  title: Search papers, books, patents, Wikipedia, YouTube transcripts
  read_only: true
  idempotent: true
  annotations:
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: true
  description: Search peer-reviewed papers, books, patents, Wikipedia, and YouTube transcripts. Use for citations, prior art,
    and grounded scientific claims.
  server_description: 'Search papers, books, patents, standards, Wikipedia, and YouTube transcripts.


    These sources belong to the Machine Library `documents` index.


    Use when: the user asks about scientific concepts, technical methods, prior art, citations,

    a DOI / ISBN / arXiv ID / PubMed ID, or wants peer-reviewed sources.


    Do not use when: the question is about news, current events, ongoing discussions, or social

    sentiment — call `machinelibrary_search_social` instead. For general web pages or code,

    use a different MCP server.


    Examples: "crispr base editing efficiency", "doi:10.1038/s41586-023-06924-6",

    "isbn:9780262033848", "arxiv:2301.00001", "transformer attention scaling laws".


    Tips:

    - Run 2-6 parallel queries with varied phrasings (synonyms, narrower/broader terms).

    - Pass an empty `query` plus `filter_issns` to browse recent issues of a specific journal.

    - Use the returned `source_uri` verbatim with `machinelibrary_fetch_document` for full text.'
  inputSchema:
    additionalProperties: false
    properties:
      query:
        default: ''
        description: Free-text search query. Can be empty when filters alone are enough (e.g. browse recent papers from one
          journal).
        maxLength: 16384
        type: string
      limit:
        default: 10
        description: Number of results to return. Keep 10 for normal agent use; use 5 when issuing several parallel queries.
        maximum: 30
        minimum: 1
        type: integer
      offset:
        default: 0
        description: Pagination offset. Use `next_offset` from a prior result.
        exclusiveMaximum: 500
        minimum: 0
        type: integer
      filter_issns:
        default: null
        description: Filter by journal ISSN. Accepts hyphenated ("0028-0836") or plain ("00280836"). Pair with empty `query`
          to browse a journal.
        items:
          type: string
        type:
        - array
        - 'null'
      filter_types:
        default: null
        description: 'Filter by CrossRef-style document type. Examples: "journal-article", "book", "book-chapter", "proceedings-article",
          "posted-content" (preprints), "patent".'
        items:
          type: string
        type:
        - array
        - 'null'
      filter_issued_after:
        default: null
        description: Only return documents published after this Unix timestamp (seconds, UTC). For "last 7 days" use `now
          - 604800`.
        type:
        - integer
        - 'null'
      filter_issued_before:
        default: null
        description: Only return documents published before this Unix timestamp (seconds, UTC).
        type:
        - integer
        - 'null'
    type: object
  inputSchema_source: tools/list from the provider's MIT source (github.com/SpaceFrontiers/mcp @ 8463874, 2026-09-29) run
    in-process; the hosted tools/list is auth-gated
  outputSchema: SearchResults {query, index, hits[DocumentResult], count, total, has_more, next_offset}
  source_operation: openapi/machinelibrary-ai-openapi.yml#searchDocuments (index_names [documents])
