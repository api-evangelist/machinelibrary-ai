runtime_notes:
  rate_limit_header_observed: x-ratelimit-limit 60 / x-ratelimit-remaining / x-ratelimit-reset on the MCP host (unauthenticated 401)
  billing: search $0.01 + $0.001 per returned result (10-hit default = $0.02); fetch $0.05; in-document search $0.015; referenced_by_limit > 0 adds a billed search (README pricing section, corroborated by /v1/pricing)
  errors: insufficient funds and auth failures surface as MCP isError results (tools.py _handle_billing_errors)
  origin_and_protocol_checks: auth.py enforces an Origin allowlist and an MCP-Protocol-Version allowlist
