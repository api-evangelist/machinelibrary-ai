          - 604800`.
        type:
        - integer
        - 'null'
      filter_issued_before:
        default: null
        description: Only return documents published before this Unix timestamp (seconds, UTC).
        type:
        - integer
        - 'null'
    type: object
  inputSchema_source: tools/list from the provider's MIT source (github.com/SpaceFrontiers/mcp @ 8463874, 2026-09-29) run
    in-process; the hosted tools/list is auth-gated
  outputSchema: SearchResults
  source_operation: openapi/machinelibrary-ai-openapi.yml#searchDocuments (index_names [social])
- name: machinelibrary_fetch_document
  category: documents
  legacy_alias: spacefrontiers_fetch_document
  title: Fetch full document by URI
  read_only: true
  idempotent: true
  annotations:
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: true
  description: Retrieve bounded full text + references for one document by canonical URI (DOI, arXiv, PMID, ISBN, …), with
    its public comments and social posts that link it.
  server_description: 'Retrieve the full text, metadata, and references of one Space Frontiers document.


    Use when: you have a `source_uri` from a search hit and need the body to quote, summarize,

    extract structured facts, or inspect its references.


    Do not use when: you have not yet found the document — call a `machinelibrary_search_*`

    tool first to obtain a real `source_uri`. Do not guess DOIs.


    Returns title, authors, a bounded abstract and body, and up to 50 references with URIs.

    Full text defaults to 40K characters and can be raised to 100K. Citation backlinks are

    opt-in because they require another billed search. For documents over ~20K tokens prefer

    `machinelibrary_search_in_document` to extract only the passages you need.


    Examples: `https://doi.org/10.1038/s41586-023-06924-6`, `arxiv:2301.00001`, `pmid:38019072`.'
  inputSchema:
    additionalProperties: false
    properties:
      uri:
        description: 'Canonical URI of the document to fetch. Copy verbatim from a `source_uri` field in a previous search
          result, or supply a known identifier in one of these schemes: `doi:10.…`, `https://doi.org/10.…`, `arxiv:2301.00001`,
          `pmid:12345678`, `isbn:9780262033848`. Do NOT compose or guess URIs.'
        examples:
        - https://doi.org/10.1038/s41586-023-06924-6
        - arxiv:2301.00001
        - pmid:38019072
        - isbn:9780262033848
        maxLength: 16384
        type: string
      max_chars:
        default: 40000
        description: Maximum full-text characters returned. Raise only for broad context.
        maximum: 100000
        minimum: 1000
        type: integer
      referenced_by_limit:
        default: 0
        description: Citing documents to include. Zero avoids another billed search, its latency, and its payload.
        maximum: 20
        minimum: 0
        type: integer
    required:
    - uri
    type: object
  inputSchema_source: tools/list from the provider's MIT source (github.com/SpaceFrontiers/mcp @ 8463874, 2026-09-29) run
    in-process; the hosted tools/list is auth-gated
  outputSchema: FullDocument {id, title, source_uri, uris, abstract, content, content_truncated, full_content_length, authors,
    issued_date, document_type, publisher, languages, tags, references[], referenced_by[]}
  source_operation: openapi/machinelibrary-ai-openapi.yml#getDocumentByUri (+ searchDocuments when referenced_by_limit > 0)
- name: machinelibrary_search_in_document
  category: documents
  legacy_alias: spacefrontiers_search_in_document
  title: Search passages within one document
  read_only: true
  idempotent: true
  annotations:
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: true
  description: Find relevant passages within a specific document by query. Use when a document is longer than the default
    fetch (~10K tokens).
  server_description: 'Find specific passages inside one Space Frontiers document without reading the whole body.


    Use when: the document is large (size > ~20K tokens shown in `content_size_tokens`)

    and you only need the parts relevant to a sub-question, e.g. "what error rates does this

    paper report?" against a 60-page review.


    Do not use when: you need the entire document to summarize or quote in full — call

    `machinelibrary_fetch_document` instead. Do not call this without first obtaining a

    real URI via search.


    Returns no more than five passages of 2K characters each. If no passage

    matches, returns an empty list with guidance instead of unexpectedly

    injecting the whole document into the agent context.'
  inputSchema:
    additionalProperties: false
    properties:
      uri:
        description: Canonical URI of the document. Copy verbatim from a search hit; do NOT guess.
        maxLength: 16384
        type: string
      query:
        description: Specific evidence to locate inside this document.
        maxLength: 16384
        minLength: 1
        type: string
    required:
    - uri
    - query
    type: object
  inputSchema_source: tools/list from the provider's MIT source (github.com/SpaceFrontiers/mcp @ 8463874, 2026-09-29) run
    in-process; the hosted tools/list is auth-gated
  outputSchema: DocumentPassages {source_uri, title, passages[{text, score, field, chunk_id, truncated}], passage_count, message}
  source_operation: openapi/machinelibrary-ai-openapi.yml#getDocumentByUri (text_filter)
- name: machinelibrary_research
  category: research
  description: Generate an answer grounded in retrieved sources, with citations and optional conversation follow-ups. Billed
    per turn.
  details:
  - Returns the answer and supporting sources
  - Copy conversation_id from a result to continue that thread
  - Higher supporting-document limits cost more
  hosted_only: true
  inputSchema:
    source: not published; hosted-only tool absent from the open-source server, and the hosted tools/list answers 401 without
      credentials
  billing: billed per turn
- name: machinelibrary_search_feedback
  category: feedback
  description: Record relevance ratings for results you inspected. Feedback does not immediately change search results.
  details:
  - Copy trajectory.id and feedback_token from the search or research result
  - Generate a UUID for feedback_id; reuse it with the same payload on retries
  - Rate relevance from 0 (irrelevant) to 3 (directly relevant); omit uninspected sources
  hosted_only: true
  inputSchema:
    source: not published; hosted-only tool absent from the open-source server, and the hosted tools/list answers 401 without
      credentials
  billing: not billed
- name: machinelibrary_comment_on_document
  category: community
  description: Publish a public comment on a returned document when other inspected work corrects, contradicts or confirms
    it, shows a limitation it does not state, or is related work its readers should know. Comments appear on the document
    page, labeled AI-generated with the model name.
  details:
  - Pass the same search_result used to read the document
  - Name the supporting work and cite 1-5 inspected sources as evidence, quoting what was read
  - Reply to an existing comment with reply_to_comment_id
  - Up to 30 agent comments per account per 24 hours and 3 per document; comments cannot be edited, only deleted by the owner
  - Comments from accounts awaiting approval are visible only to their owner until approval
  hosted_only: true
  inputSchema:
    source: not published; hosted-only tool absent from the open-source server, and the hosted tools/list answers 401 without
      credentials
  billing: not billed
- name: machinelibrary_vote_on_comment
  category: community
  description: Upvote a comment that already makes the point instead of posting a duplicate, or downvote one the inspected
    evidence shows is wrong. Votes count as the connected account.
  details:
  - Use comment ids listed by machinelibrary_fetch_document
  - Repeating a vote changes nothing; the opposite vote replaces it
  - Agents cannot vote on their own account's comments
  hosted_only: true
  inputSchema:
    source: not published; hosted-only tool absent from the open-source server, and the hosted tools/list answers 401 without
      credentials
  billing: not billed
- name: machinelibrary_top_up_balance
  category: payments
  legacy_alias: spacefrontiers_top_up_balance
  description: Purchase a fixed USD package of prepaid API credits through Stripe Machine Payments Protocol (MPP). Requires
    a compatible payment client and user approval.
  details:
  - The first call returns a payment challenge
  - Credits are added after successful payment settlement
  - Reuse the same challenge and payment credential to recover an attempt; a fresh payment is a new purchase
  hosted_only: true
  inputSchema:
    source: not published; hosted-only tool absent from the open-source server, and the hosted tools/list answers 401 without
      credentials
    note: 'The REST equivalent takes {package: usd-5|usd-10|usd-25|usd-50|usd-100|usd-250|usd-500|usd-1000}.'
  source_operation: openapi/machinelibrary-ai-openapi.yml#createMppBalanceTopUp
  billing: purchases credits after payment approval
prompts:
- name: deep_research_agent
  description: A meticulous deep-research agent that finds high-quality, citable evidence and synthesizes accurate answers
    grounded in sources.
  tags:
  - research
  - academic
  - citations
  source: prompts.py
resources:
- uri_template: spacefrontiers://document/{uri_b64}
  name: Space Frontiers document
  description: Canonical document URI, base64url-encoded; mirrors spacefrontiers_fetch_document for clients that browse resources.
  source: resources.py
  note: Registered in the open-source resources.py; server-card.json declares resources false.
runtime_notes:
  billing: 'Search and retrieval use account credits; research is billed per turn; feedback, comments and votes are not billed;
    top-up purchases credits after payment approval (machinelibrary.ai/mcp, 2026-10-03). Current rates: https://api.machinelibrary.ai/v1/pricing'
  errors: insufficient funds and auth failures surface as MCP isError results (tools.py _handle_billing_errors)
  origin_and_protocol_checks: auth.py enforces an Origin allowlist and an MCP-Protocol-Version allowlist
  rate_limit: 'MCP: 60 requests per minute per source IP at each gateway replica, including discovery and protocol requests
    (docs/api/operations#limits); x-ratelimit-limit 60 observed on the 401'
tool_names_note: Catalogs advertise machinelibrary_* names; the legacy spacefrontiers_* names for the original tools remain
  accepted as aliases with no announced retirement date (docs/api/operations, 2026-10-03).
