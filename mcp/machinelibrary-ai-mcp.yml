server:
  name: org.spacefrontiers/search
  title: Machine Library MCP Server
  version: 0.1.0
  transport: streamable-http
  url: https://mcp.machinelibrary.ai
  supported_protocol_versions:
  - '2025-03-26'
  - '2025-06-18'
  - '2025-11-25'
  capabilities:
    tools: true
    resources: false
    prompts: true
auth:
  methods:
  - oauth2
  - apikey
  oauth2:
    authorization_server: https://api.machinelibrary.ai
    protected_resource_metadata: https://mcp.machinelibrary.ai/.well-known/oauth-protected-resource
    authorization_server_metadata: https://api.machinelibrary.ai/.well-known/oauth-authorization-server
    scopes_supported:
    - search
    pkce: S256
    dynamic_client_registration: https://api.machinelibrary.ai/v2/oauth/register
  apikey:
    header: Authorization
    scheme: Bearer
    key_format: id:ml_<secret> for new keys; existing keys remain supported
    keys_page: https://machinelibrary.ai/keys
tool_count: 7
tools:
- name: machinelibrary_search_documents
  category: search
  description: Search papers, books, patents, standards, Wikipedia and YouTube transcripts; compact reranked results,
    billed usage.
  source: https://machinelibrary.ai/install.md
- name: machinelibrary_search_social
  category: search
  description: Search Reddit, Telegram and Discord; compact reranked results, billed usage.
  source: https://machinelibrary.ai/install.md
- name: machinelibrary_fetch_document
  category: documents
  description: Retrieve bounded full text and references by canonical URI. Citation backlinks are opt-in and add
    a separately billed search.
  source: https://machinelibrary.ai/install.md
- name: machinelibrary_search_in_document
  category: documents
  description: Retrieve up to five matching passages within a document.
  source: https://machinelibrary.ai/install.md
- name: machinelibrary_research
  category: research
  description: Generate a cited answer with optional conversation follow-ups; billed per turn.
  source: https://machinelibrary.ai/install.md
- name: machinelibrary_search_feedback
  category: feedback
  description: Record relevance ratings for inspected search or research results. Copy trajectory.id and feedback_token
    from the result; generate a UUID feedback_id and reuse the UUID and payload on retries. Does not immediately
    change search.
  source: https://machinelibrary.ai/install.md
- name: machinelibrary_top_up_balance
  category: payments
  description: Purchase fixed USD prepaid-credit packages through Stripe MPP. Returns a challenge; settlement requires
    a compatible payment client and user approval. Reuse the same challenge and payment credential for recovery;
    a fresh payment is a new purchase.
  source: https://machinelibrary.ai/install.md
schema_note: Obtain input/output schemas from authenticated tools/list. Schemas from the standalone Python package
  are not represented as hosted schemas.
legacy_tool_aliases:
  spacefrontiers_search_documents: machinelibrary_search_documents
  spacefrontiers_search_social: machinelibrary_search_social
  spacefrontiers_fetch_document: machinelibrary_fetch_document
  spacefrontiers_search_in_document: machinelibrary_search_in_document
  spacefrontiers_research: machinelibrary_research
  spacefrontiers_search_feedback: machinelibrary_search_feedback
  spacefrontiers_top_up_balance: machinelibrary_top_up_balance
standalone_package:
  source: https://github.com/SpaceFrontiers/mcp
  note: Separate Python implementation with its own versions, names and capabilities. Its resources and prompts
    do not establish the hosted contract.
runtime_notes:
  billing: Consult https://machinelibrary.ai/pricing and https://api.machinelibrary.ai/v1/pricing for current usage
    rates. Read-only retrieval is still billed.
  errors: Authentication challenges and tool failures are distinct; follow auth.md and the operations guide. Feedback
    requires a valid UUID and the original result receipt.
  limits: https://machinelibrary.ai/docs/api/operations#limits
